name: Production Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/regression_test.py'
      - '.github/workflows/production-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for production deployment
        run: sleep 30
      - name: Run production functional regression
        run: python tests/regression_test.py
